---
# Spell-check config for the pre-commit `cspell` hook (see flake.nix).
#
# Replaces codespell, which could only think in English and auto-rewrote what it
# did not recognise. cspell reports only — there is no write mode — so a new
# word fails the commit and you either fix it or add it to project-words.txt.
#
# Comments sit above their key, never inside a list: yamlfix rewrites
# single-item lists to flow style and strands a comment left inside one.
version: '0.2'

# en-GB alongside en-US because the prose here uses British forms throughout
# (behaviour, prioritise, visualisation, Authorisation); both dictionaries ship
# bundled, so this costs nothing.
#
# There is no Danish dictionary any more. It arrived with the job-search
# workspace, which now lives in its own repo; once that left, the entire
# apparatus - a 2.1 MB fetchzip in flake.nix, a .cspell-dicts symlink from the
# shellHook, an import here and a per-path override - was earning exactly one
# word ("lede", in overrides/portfolio.html). That word is in project-words.txt
# instead. Bring the dictionary back only if real Danish prose returns.
language: en,en-GB
dictionaryDefinitions:
  - name: project-words
    path: ./project-words.txt
    description: 'Repo-specific vocabulary: tooling, product and personal names.'
dictionaries: [project-words]
ignorePaths:
  - .git/**
  - .direnv/**
  - .venv/**
  - site/**  # Zensical build output
  - '**/node_modules/**'
  - flake.lock
  - '**/*.lock'
  - '**/package-lock.json'
  # Frozen record of documents that were actually submitted. Editing them to
  # satisfy a linter would falsify the archive, so it is not linted.
  # (It does contain at least one real typo: "fleksibiliet" in cph/star/tryg.)
  - cv/vault/archive/**
